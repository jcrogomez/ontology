initial: drafting
context:
  draft:
    value: null
    unit: kg
  confirmationRequested: false
states:
  drafting:
    description: User is entering a measurement
    on:
      REQUEST_CONFIRMATION:
        target: reviewing
        guard: hasWeight
        effects:
          - noteConfirmationRequested
  reviewing:
    description: User reviews the measurement before commit
    on:
      CONFIRM:
        target: completed
        effects:
          - persistMeasurement
      EDIT:
        target: drafting
  completed:
    type: final
events:
  - name: REQUEST_CONFIRMATION
    description: Ask to review the entered measurement
    payload:
      source: StickyPrimaryButton
  - name: CONFIRM
    description: Accept and commit the measurement
  - name: EDIT
    description: Return to editing
guards:
  - name: hasWeight
    description: Draft measurement must have a value
    condition: context.draft.value != null
effects:
  - name: noteConfirmationRequested
    description: Flag that confirmation was requested
    kind: assignment
  - name: persistMeasurement
    description: Save the measurement
    kind: io
