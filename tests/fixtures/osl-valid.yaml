id: IdeMainView
version: 1.0.0
task: trigger_compilation
actor: developer
context:
  operation: ide_interaction
  locale: en-US
domainEntities:
  - Workspace
  - Pipeline
information:
  summary:
    - activeView
    - pendingChanges
    - intent
    - status
interaction:
  primaryAction: trigger_compilation
  varianceHandling: log_errors
components:
  - id: Screen
    semanticType: screen-container
  - id: TopologicalMinimap
    semanticType: minimap
  - id: NodeCard
    semanticType: card
  - id: SplitPane
    semanticType: layout
layout:
  type: stack
visual:
  emphasis: high-clarity
data:
  writes:
    - Workspace.activeView
    - Pipeline.status
target: react-web
