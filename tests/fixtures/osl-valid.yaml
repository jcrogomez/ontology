id: HarvestConfirmation
version: 1.0.0
task: confirm_harvest_batch
actor: operator
context:
  operation: harvest_confirmation
  locale: en-US
domainEntities:
  - HarvestBatch
  - InventoryLot
information:
  summary:
    - batch_id
    - crop_name
    - expected_weight
    - lot_id
interaction:
  primaryAction: confirm_harvest_batch
  varianceHandling: reason_when_threshold_exceeded
components:
  - id: Screen
    semanticType: screen-container
  - id: HeaderSummary
    semanticType: context-summary
  - id: NumericWeightInput
    semanticType: numeric-measurement-input
    events:
      - onValueChange
      - onValueCommit
  - id: VarianceAlert
    semanticType: variance-explanation-alert
    events:
      - onReasonChange
      - onReasonProvided
      - onDismissRequested
  - id: StickyPrimaryButton
    semanticType: sticky-primary-action
    events:
      - onIntent
      - onConfirmRequested
  - id: OfflineSyncBadge
    semanticType: sync-state-indicator
layout:
  type: stack
visual:
  emphasis: high-clarity
data:
  writes:
    - HarvestBatch.actual_weight
    - HarvestBatch.loss_reason
target: react-web
