id: render-weigh-patient
viewId: weigh-patient
version: 1.0.0
entityRefs:
  - patient
  - weightMeasurement
taskRef: record-patient-weight
machine:
  initial: editing
  context:
    dirty: false
    value: null
  states:
    editing:
      on:
        COMMIT:
          target: confirming
          effects:
            - persistWeight
    confirming:
      on:
        CONFIRM:
          target: completed
          guard: hasValidWeight
    completed:
      type: final
  events:
    - name: COMMIT
      description: Commit the entered weight value
    - name: CONFIRM
      description: Confirm the measurement
  guards:
    - name: hasValidWeight
      description: Weight must be within allowable clinical limits
      condition: context.value != null
  effects:
    - name: persistWeight
      description: Persist the drafted measurement
      kind: io
layout:
  kind: stack
  gap: md
nodes:
  - id: root
    component: FormFrame
    props:
      title: Record patient weight
    children:
      - id: weight-input
        component: NumericWeightInput
        props:
          label: Weight
          unit: kg
      - id: alerts
        component: VarianceAlert
        props:
          threshold: 2
        condition:
          field: weightMeasurement.delta
          operator: ">"
          value: 2
        children:
          - id: explain-button
            component: StickyPrimaryButton
            props:
              label: Provide reason
dataBindings:
  - id: bind-weight-value
    source: weightMeasurement.value
    target: weight-input.props.value
  - id: bind-delta
    source: weightMeasurement.delta
    target: alerts.props.delta
target: react-web
