id: render-harvest-confirmation
viewId: HarvestConfirmation
version: 1.0.0
entityRefs:
  - harvest_batch
  - inventory_lot
taskRef: confirm_harvest_batch
layout:
  type: stack
  gap: comfortable
nodes:
  - id: screen
    component: Screen
    props:
      title: Confirm harvest batch
      mode: operator
    children:
      - id: summary
        component: HeaderSummary
        props:
          title: Batch summary
          syncStatus: queued
      - id: weight
        component: NumericWeightInput
        props:
          field: actual_weight
          label: Actual weight
          unit: g
          size: large
      - id: variance
        component: VarianceAlert
        props:
          threshold: 5
          requiresReason: true
      - id: offline
        component: OfflineSyncBadge
        props:
          status: queued
      - id: confirm
        component: StickyPrimaryButton
        props:
          action: confirm_harvest_batch
          label: Confirm batch
dataBindings:
  - id: bind-actual-weight
    source: HarvestBatch.actual_weight
    target: weight.props.value
target: react-web
