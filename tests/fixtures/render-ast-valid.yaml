id: render-ide-main-view
viewId: IdeMainView
version: 1.0.0
entityRefs:
  - workspace
  - pipeline
taskRef: trigger_compilation
layout:
  type: stack
  gap: comfortable
nodes:
  - id: screen
    component: Screen
    props:
      title: Ontology Studio IDE
      mode: developer
    children:
      - id: split
        component: SplitPane
        props:
          orientation: horizontal
        children:
          - id: minimap
            component: TopologicalMinimap
            props: {}
          - id: node-card
            component: NodeCard
            props: {}
dataBindings:
  - id: bind-workspace-status
    source: Workspace.pendingChanges
    target: split.props.status
target: react-web
